name: Android APK Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "**.gd"
      - "**.tscn"
      - "**.tres"
      - "**.godot"
      - "project.godot"
      - "export_presets.cfg"
      - ".github/workflows/android-build.yml"

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4.1
    env:
      ANDROID_HOME: /usr/lib/android-sdk
      ANDROID_SDK_ROOT: /usr/lib/android-sdk
      GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /github/home/.android/debug.keystore
      GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
      GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Java and Android SDK
        run: |
          apt-get update
          apt-get install -y --no-install-recommends openjdk-17-jdk-headless wget unzip
          export JAVA_HOME="$(dirname "$(dirname "$(readlink -f "$(command -v javac)")")")"
          echo "JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/cmdline-tools/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          echo "Using SDK manager: $SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platform-tools" "platforms;android-33" "build-tools;33.0.2"
          mkdir -p /github/home/.android
          keytool -genkeypair -v -keystore /github/home/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          echo "Installed Android SDK packages:"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" --list_installed
          mkdir -p /github/home/.config/godot
          cat > /github/home/.config/godot/editor_settings-4.tres <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF
          echo "Godot editor settings:"
          cat /github/home/.config/godot/editor_settings-4.tres
          echo "SDK directory checks:"
          test -x "$ANDROID_HOME/platform-tools/adb"
          test -x "$ANDROID_HOME/build-tools/33.0.2/aapt"
          test -d "$ANDROID_HOME/platforms/android-33"
          ls -la "$ANDROID_HOME/build-tools/33.0.2"

      - name: Install matching Godot Android export templates
        run: |
          mkdir -p /github/home/.local/share/godot/export_templates/4.4.1.stable
          wget -q https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz -O /tmp/godot-templates.tpz
          mkdir -p /tmp/godot-templates
          unzip -q /tmp/godot-templates.tpz -d /tmp/godot-templates
          cp /tmp/godot-templates/templates/android_debug.apk /github/home/.local/share/godot/export_templates/4.4.1.stable/
          cp /tmp/godot-templates/templates/android_release.apk /github/home/.local/share/godot/export_templates/4.4.1.stable/
          ls -lh /github/home/.local/share/godot/export_templates/4.4.1.stable/

      - name: Validate project and import assets
        run: godot --headless --editor --path . --quit

      - name: Export debug APK
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Android Debug" build/Myanmar-Empire-of-Warriors-debug.apk

      - name: Verify APK
        run: test -s build/Myanmar-Empire-of-Warriors-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Myanmar-Empire-of-Warriors-debug
          path: build/Myanmar-Empire-of-Warriors-debug.apk
          if-no-files-found: error
          retention-days: 14
