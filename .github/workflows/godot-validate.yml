name: Godot Project Validation

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Parse and import all project resources
        run: godot --headless --editor --path . --quit
      - name: Run main scene briefly
        run: godot --headless --path . --quit-after 3
